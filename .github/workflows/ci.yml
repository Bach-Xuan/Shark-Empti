name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USE_EMULATORS: 'true'
      NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-shark-empti
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-shark-empti.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-shark-empti.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456'
    steps:
      # Action runtimes use Node 24 and require runner >= 2.327.1.
      # Review release notes/manifests before replacing these immutable commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          E2E_PRODUCTION: true
      - run: node scripts/bundle-report.mjs
      - run: node scripts/production-smoke.mjs
      - run: node --import tsx scripts/performance-baseline.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          archive: true
          path: |
            test-results/
            coverage/
            reports/
