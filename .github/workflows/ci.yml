name: Validate
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_USE_EMULATORS: 'true'
      NEXT_PUBLIC_FIREBASE_API_KEY: test-api-key
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-shark-empti
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-shark-empti.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-shark-empti.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - run: npm run test:e2e
        env:
          E2E_PRODUCTION: true
      - run: node scripts/bundle-report.mjs
      - run: node scripts/production-smoke.mjs
      - run: node --import tsx scripts/performance-baseline.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            coverage/
            reports/
